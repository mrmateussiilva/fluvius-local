<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redefinir senha | Fluvius</title>
  <link rel="icon" type="image/png" href="/brand-assets/logo_thumbnail.png" />
  <style>
    :root {
      --bg: #0b1220;
      --surface: #111827;
      --surface2: #172033;
      --border: #263348;
      --text: #f8fafc;
      --muted: #9aa7bd;
      --accent: #16a34a;
      --accent2: #22c55e;
      --red: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        linear-gradient(180deg, rgba(11, 18, 32, 0.92), rgba(11, 18, 32, 0.98)),
        url('/brand-assets/logo_dark.png') center 8% / 180px auto no-repeat,
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(440px, 100%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.4);
      padding: 24px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }
    .brand img { width: 36px; height: 36px; }
    .brand strong { font-size: 16px; }
    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      line-height: 1.2;
      letter-spacing: 0;
    }
    p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }
    label {
      display: block;
      margin: 14px 0 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }
    input {
      width: 100%;
      min-height: 44px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font: inherit;
      padding: 10px 12px;
      outline: none;
    }
    input:focus {
      border-color: var(--accent2);
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.16);
    }
    button, a.button {
      width: 100%;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 18px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: white;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      text-decoration: none;
    }
    button:disabled {
      cursor: wait;
      opacity: 0.72;
    }
    .message {
      display: none;
      margin-top: 14px;
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
      line-height: 1.5;
    }
    .message.error {
      display: block;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fecaca;
    }
    .message.success {
      display: block;
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.35);
      color: #bbf7d0;
    }
    .account {
      display: none;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin: 16px 0;
      font-size: 13px;
      line-height: 1.6;
    }
    .account span { color: var(--muted); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <img src="/brand-assets/logo.png" alt="Fluvius" />
      <strong>Fluvius</strong>
    </div>
    <h1>Redefinir senha</h1>
    <p>Defina uma nova senha para acessar o painel de atendimento.</p>

    <div class="account" id="accountBox">
      <div><span>Login:</span> <strong id="accountEmail">-</strong></div>
      <div><span>Usuário:</span> <strong id="accountName">-</strong></div>
    </div>

    <form id="resetForm">
      <label for="password">Nova senha</label>
      <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required />

      <label for="passwordConfirmation">Confirmar nova senha</label>
      <input id="passwordConfirmation" name="passwordConfirmation" type="password" minlength="8" autocomplete="new-password" required />

      <button id="submitButton" type="submit">Salvar nova senha</button>
    </form>

    <div class="message" id="message"></div>
    <a class="button hidden" id="loginLink" href="/">Entrar no Fluvius</a>
  </main>

  <script>
    const token = decodeURIComponent(window.location.pathname.split('/').filter(Boolean).pop() || '');
    const form = document.getElementById('resetForm');
    const message = document.getElementById('message');
    const loginLink = document.getElementById('loginLink');
    const submitButton = document.getElementById('submitButton');

    const errorMessages = {
      invalid_token: 'Link inválido. Solicite um novo link de redefinição.',
      token_expired: 'Este link expirou. Solicite um novo link de redefinição.',
      token_already_used: 'Este link já foi usado. Solicite um novo link de redefinição.',
      password_too_short: 'A senha deve ter pelo menos 8 caracteres.',
      password_confirmation_mismatch: 'A confirmação da senha não confere.',
    };

    function showMessage(type, text) {
      message.className = `message ${type}`;
      message.textContent = text;
    }

    function disableForm() {
      form.classList.add('hidden');
    }

    async function readJson(response) {
      const text = await response.text();
      if (!text) return {};
      return JSON.parse(text);
    }

    async function loadTokenInfo() {
      try {
        const response = await fetch(`/api/password-reset/${encodeURIComponent(token)}`);
        const data = await readJson(response);
        if (!response.ok) {
          disableForm();
          showMessage('error', errorMessages[data.error] || 'Não foi possível validar este link.');
          return;
        }

        document.getElementById('accountEmail').textContent = data.user?.email || '-';
        document.getElementById('accountName').textContent = data.user?.name || '-';
        document.getElementById('accountBox').style.display = 'block';
      } catch (err) {
        disableForm();
        showMessage('error', 'Não foi possível validar este link agora.');
      }
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const password = document.getElementById('password').value;
      const passwordConfirmation = document.getElementById('passwordConfirmation').value;

      if (password.length < 8) {
        showMessage('error', errorMessages.password_too_short);
        return;
      }
      if (password !== passwordConfirmation) {
        showMessage('error', errorMessages.password_confirmation_mismatch);
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = 'Salvando...';
      try {
        const response = await fetch(`/api/password-reset/${encodeURIComponent(token)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password, password_confirmation: passwordConfirmation }),
        });
        const data = await readJson(response);
        if (!response.ok) {
          showMessage('error', errorMessages[data.error] || 'Não foi possível redefinir a senha.');
          return;
        }

        disableForm();
        showMessage('success', 'Senha redefinida com sucesso. Use o mesmo login para entrar no Fluvius.');
        if (data.chatwoot_url) loginLink.href = data.chatwoot_url;
        loginLink.classList.remove('hidden');
      } catch (err) {
        showMessage('error', 'Não foi possível redefinir a senha agora.');
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = 'Salvar nova senha';
      }
    });

    loadTokenInfo();
  </script>
</body>
</html>
